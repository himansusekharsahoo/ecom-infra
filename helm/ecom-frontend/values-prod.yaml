# Production. Expects an external database and cache.

replicaCount: 3

image:
  repository: ghcr.io/himansusekharsahoo/ecom
  tag: latest
  pullPolicy: Always

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: prod.ecommerce.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

app:
  nodeEnv: production

# Create this Secret in ecommerce-prod before the first sync:
#   kubectl create secret generic ecom-frontend-app \
#     --namespace ecommerce-prod \
#     --from-literal=DATABASE_URL='postgresql://USER:PASSWORD@HOST:5432/ecom' \
#     --from-literal=REDIS_URL='redis://HOST:6379'
secret:
  create: false
  existingSecret: ecom-frontend-app

postgres:
  enabled: false

redis:
  enabled: false

database:
  url: ""

cache:
  url: ""
