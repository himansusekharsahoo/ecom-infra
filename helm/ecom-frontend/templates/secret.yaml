{{- if .Values.secret.create }}
{{- $databaseUrl := include "ecom-frontend.databaseUrl" . }}
{{- $redisUrl := include "ecom-frontend.redisUrl" . }}
{{- if not $databaseUrl }}
{{- fail "DATABASE_URL is required. Set database.url or enable postgres.enabled." }}
{{- end }}
{{- if not $redisUrl }}
{{- fail "REDIS_URL is required. Set cache.url or enable redis.enabled." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ecom-frontend.secretName" . }}
  labels:
    {{- include "ecom-frontend.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ $databaseUrl | quote }}
  REDIS_URL: {{ $redisUrl | quote }}
{{- end }}
