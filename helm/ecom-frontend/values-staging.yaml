# Staging. Uses the published GHCR image from ecom CI.

replicaCount: 2

image:
  repository: ghcr.io/himansusekharsahoo/ecom
  tag: latest
  pullPolicy: Always

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: staging.ecommerce.local
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: false

app:
  nodeEnv: production

secret:
  create: true

postgres:
  enabled: true
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  enabled: true
  persistence:
    enabled: true
    size: 1Gi
