apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecom-frontend-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/himansusekharsahoo/ecom-infra.git
    targetRevision: main
    path: helm/ecom-frontend
    helm:
      releaseName: ecom-frontend
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
